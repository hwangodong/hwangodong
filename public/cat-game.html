<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>황오동 고양이를 찾아서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#0b0c1c; overflow:hidden;
    font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { image-rendering:pixelated; image-rendering:crisp-edges; background:#0b0c1c; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; top:14px; left:16px; color:#ffe7b0; font-size:26px;
    text-shadow:0 2px 0 #000, 0 0 12px rgba(255,160,60,.35);
    display:none; align-items:center; gap:10px; user-select:none; pointer-events:none; z-index:5; }
  #hud .paw { font-size:22px; }
  #muteBtn { position:fixed; top:12px; right:16px; z-index:6; background:rgba(20,16,40,.6);
    border:1px solid rgba(255,200,120,.35); color:#ffe7b0; font-size:18px; border-radius:8px;
    padding:4px 10px; cursor:pointer; display:none; font-family:inherit; }
  #hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); color:#cdb98f;
    font-size:19px; text-shadow:0 1px 0 #000; opacity:0; transition:opacity 1s; pointer-events:none; z-index:5; }

  /* ---------- 타이틀 ---------- */
  #title { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at 50% 35%, rgba(40,30,70,.88), rgba(8,8,22,.97));
    transition:opacity 1.1s; }
  #title.hidden { opacity:0; pointer-events:none; }
  #title h1 { font-weight:700; font-size:clamp(40px,7.5vw,76px); color:#ffd98a; line-height:1.15;
    text-shadow:0 3px 0 #5a2e16, 0 6px 0 rgba(0,0,0,.55), 0 0 36px rgba(255,170,60,.4);
    text-align:center; }
  #title h1 span { display:inline-block; animation:wob 2.6s ease-in-out infinite; }
  @keyframes wob { 0%,100%{transform:rotate(-2.2deg) translateY(0)} 50%{transform:rotate(2.2deg) translateY(-4px)} }
  #title .sub { color:#b8a8d8; font-size:clamp(17px,2.4vw,24px); letter-spacing:2px; }
  #title .catline { font-size:30px; letter-spacing:14px; filter:drop-shadow(0 0 8px rgba(255,170,80,.45)); }
  #startBtn { margin-top:14px; font-family:inherit; font-size:26px; color:#2a1608;
    background:linear-gradient(#ffd98a,#f0a850); border:none; border-radius:14px;
    padding:10px 38px; cursor:pointer; box-shadow:0 4px 0 #8a5520, 0 8px 22px rgba(0,0,0,.5);
    transition:transform .12s; }
  #startBtn:hover { transform:translateY(-2px) scale(1.03); }
  #title .keys { color:#8d83ad; font-size:17px; margin-top:6px; }

  /* ---------- 이름 카드 ---------- */
  #card { position:fixed; left:50%; bottom:64px; transform:translateX(-50%) translateY(30px);
    z-index:8; background:rgba(24,18,42,.92); border:2px solid #d9a356; border-radius:16px;
    padding:12px 22px 12px 14px; display:flex; align-items:center; gap:14px;
    opacity:0; pointer-events:none; transition:opacity .35s, transform .35s;
    box-shadow:0 8px 30px rgba(0,0,0,.6), 0 0 24px rgba(255,170,60,.18); }
  #card.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #cardPortrait { width:72px; height:72px; image-rendering:pixelated; border-radius:10px;
    background:#141026; border:1px solid rgba(255,200,120,.3); }
  #cardName { color:#ffd98a; font-size:30px; font-weight:700; line-height:1; }
  #cardName small { color:#9a8fc0; font-size:16px; font-weight:400; margin-left:8px; }
  #cardDesc { color:#d8cfae; font-size:18px; margin-top:5px; max-width:340px; line-height:1.3; }

  /* ---------- 엔딩 ---------- */
  #end { position:fixed; inset:0; z-index:12; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; background:rgba(8,7,20,0);
    opacity:0; pointer-events:none; transition:opacity 2s, background 2s; }
  #end.show { opacity:1; pointer-events:auto; background:rgba(8,7,20,.86); }
  #end .moon { font-size:44px; filter:drop-shadow(0 0 18px rgba(255,230,160,.6)); }
  #end p { color:#ffe7b0; font-size:clamp(24px,4vw,38px); text-align:center; line-height:1.5;
    max-width:760px; padding:0 20px; text-shadow:0 2px 0 #000, 0 0 24px rgba(255,180,80,.35); }
  #endCats { font-size:34px; letter-spacing:10px; margin-top:4px; }
  #endCats span { display:inline-block; animation:hop 1.6s ease-in-out infinite; }
  @keyframes hop { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #againBtn { font-family:inherit; font-size:22px; color:#2a1608; background:linear-gradient(#ffd98a,#f0a850);
    border:none; border-radius:12px; padding:8px 30px; cursor:pointer; margin-top:10px;
    box-shadow:0 3px 0 #8a5520; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="320" height="240"></canvas></div>

<div id="hud"><span class="paw">🐾</span><span id="count">고양이 0 / 7</span></div>
<button id="muteBtn">🔊</button>
<div id="hint">방향키 / WASD 이동 · 가까이 가면 빛이 나요 · 스페이스(클릭)로 찾기</div>

<div id="title">
  <div class="catline">🏮 🐈‍⬛ 🏮</div>
  <h1 id="titleText"></h1>
  <div class="sub">— 경주 황오동, 골목 음악축제의 밤 —</div>
  <button id="startBtn">골목으로 들어가기</button>
  <div class="keys">이동: 방향키·WASD &nbsp;|&nbsp; 찾기: 스페이스·클릭 &nbsp;|&nbsp; 소리: M</div>
</div>

<div id="card">
  <canvas id="cardPortrait" width="24" height="24"></canvas>
  <div>
    <div id="cardName"></div>
    <div id="cardDesc"></div>
  </div>
</div>

<div id="end">
  <div class="moon">🌙</div>
  <p>오늘 밤 황오동의 고양이들이<br>당신을 기다리고 있었어요.</p>
  <div id="endCats"></div>
  <button id="againBtn">다시 골목을 걷기</button>
</div>

<script>
'use strict';
/* =========================================================
   황오동 고양이를 찾아서 — 단일 파일 픽셀 탐험 게임
   ========================================================= */
const TILE = 16, VIEW_W = 320, VIEW_H = 240;

/* ---------- 맵 (40 x 30) ----------
   # 돌담  = 나무울타리  A 기와지붕  H 벽  W 창  D 문
   p 화분  L 등불  s 입간판  t 나무
   . 흙골목  , 돌포장  * 축제광장                       */
const MAP_ROWS = [
"########################################",
"#,,,,,,,,,#.........#******************#",
"#,AAAAAA,,#..AAAAAA.#*L************L***#",
"#,AAAAAA,,#..AAAAAA.#******************#",
"#,HWDWWH,,#..HWWDWH.#******************#",
"#,,,,,,,,,,.........,,*****,,,,*****,,,#",
"#,,,L,,,,,,,,,,,L,,,,,,,,,L,,,,,,,,L,,,#",
"#=====,,======,,=======,,=======,,=====#",
"#......................................#",
"#.AAAAAAA...............######,,######.#",
"#.AAAAAAA...............#.........t..#.#",
"#.HWWDWWH...............#.....L......#.#",
"#.p.....p...............#............#.#",
"#............AAAAAAA....##############.#",
"#............AAAAAAA...................#",
"#..........s.HWWDWWH...................#",
"#....L......................L..........#",
"#.......######,,########,,######.......#",
"#......................................#",
"#.=======..............................#",
"#.......=...............AAAAAAAA.......#",
"#.......=...............AAAAAAAA.......#",
"#.......=................HWWDWWWH......#",
"#..............L.........p......p......#",
"#......................................#",
"#.........#########,,#########.........#",
"#,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,#",
"#,,,L,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,L,,,#",
"#,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,#",
"########################################"];
const MAP_W = 40, MAP_H = 30;
MAP_ROWS.forEach((r,i)=>{ if(r.length!==MAP_W) console.error('맵 '+i+'행 길이 오류:', r.length); });

const SOLID = new Set(['#','=','A','H','W','D','p','L','s','t']);
const tileAt = (tx,ty)=> (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) ? '#' : MAP_ROWS[ty][tx];
const solidAt = (tx,ty)=> SOLID.has(tileAt(tx,ty));

/* ---------- 고양이 7마리 ---------- */
const CATS = [
 {name:'첨성이', sub:'까만 별지기', color:'#26262e', belly:'#4a4a56', eye:'#ffe27a',
  desc:'밤마다 지붕에 올라 별을 세는 까만 고양이.', tx:4, ty:3, hide:'roof', pitch:1.12},
 {name:'남빵이', sub:'빵집 단골', color:'#c98c4e', belly:'#eed9b0', eye:'#5a3d1e',
  desc:'갓 구운 황남빵 냄새를 따라다니는 빵색 고양이.', tx:11, ty:15, hide:'sign', pitch:0.95},
 {name:'동궁이', sub:'불빛 구경꾼', color:'#e8b23a', belly:'#fbe9b8', eye:'#4a3a14',
  desc:'축제 등불 구경을 제일 좋아하는 치즈 고양이.', tx:35, ty:2, hide:'lantern', pitch:1.25},
 {name:'보문이', sub:'화분 요정', color:'#efe9dc', belly:'#fff', eye:'#7ab0c8',
  desc:'화분 속이 세상에서 제일 포근하다는 하얀 고양이.', tx:2, ty:12, hide:'pot', pitch:1.35},
 {name:'단디', sub:'할매네 막내', color:'#8a8f9c', belly:'#c4c8d2', eye:'#dce6a0',
  desc:'"단디 해라!" 골목 할매가 이름 지어 준 회색 고양이.', tx:2, ty:20, hide:'corner', pitch:1.05},
 {name:'야시', sub:'담장 위 새침이', color:'#d96f32', belly:'#f5cfa0', eye:'#3f5a28',
  desc:'담장 위가 자기 안방인 새침한 줄무늬 고양이.', tx:20, ty:17, hide:'wall', pitch:1.18},
 {name:'마립간', sub:'골목의 왕', color:'#6b4a32', belly:'#a8826a', eye:'#e8c24a',
  desc:'천 년째 이 골목을 다스리고 계신(?) 의젓한 왕.', tx:34, ty:11, hide:'tree', pitch:0.78},
];
CATS.forEach(c=>{ c.found=false; c.near=false; c.foundT=0;
  c.x=c.tx*TILE+8; c.y=c.ty*TILE+8; });

/* ---------- 캔버스 ---------- */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fitCanvas(){
  const s = Math.min(innerWidth/VIEW_W, innerHeight/VIEW_H);
  const k = s >= 2 ? Math.floor(s) : s*0.98;
  cv.style.width  = (VIEW_W*k)+'px';
  cv.style.height = (VIEW_H*k)+'px';
}
addEventListener('resize', fitCanvas); fitCanvas();

/* =========================================================
   타일 픽셀아트 — 정적 맵을 오프스크린에 미리 렌더
   ========================================================= */
const mapCv = document.createElement('canvas');
mapCv.width = MAP_W*TILE; mapCv.height = MAP_H*TILE;
const mc = mapCv.getContext('2d'); mc.imageSmoothingEnabled = false;

function hash(x,y){ let h=(x*374761393+y*668265263)|0; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }
function px(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x,y,w,h); }

function drawGroundDirt(g,X,Y,tx,ty){
  px(g,X,Y,16,16, hash(tx,ty)>.5?'#675640':'#6b5a44');
  for(let i=0;i<4;i++){ const r=hash(tx*7+i,ty*13+i);
    px(g, X+((r*16)|0), Y+((hash(ty+i,tx)*16)|0), 1,1, r>.6?'#7a6850':'#564735'); }
}
function drawGroundPaved(g,X,Y,tx,ty){
  px(g,X,Y,16,16,'#585c6e');
  const o=(tx+ty)%2*4;
  for(let r=0;r<2;r++) for(let c=0;c<2;c++){
    const v=hash(tx*3+c,ty*5+r), col=v>.66?'#737789':v>.33?'#6a6e80':'#646878';
    px(g, X+c*8+((r%2)?o/2:0), Y+r*8, 7,7, col); }
  if(hash(tx,ty*9)>.85) px(g,X+6,Y+6,2,1,'#7d8194');
}
function drawGroundPlaza(g,X,Y,tx,ty){
  px(g,X,Y,16,16,'#6e6354');
  for(let r=0;r<2;r++) for(let c=0;c<2;c++)
    px(g, X+c*8, Y+r*8, 7,7, hash(tx+c,ty+r)>.5?'#7d7163':'#776b5d');
  const v=hash(tx*11,ty*17);
  if(v>.8) px(g,X+((v*13)|0),Y+((hash(ty,tx*5)*13)|0),2,2, v>.93?'#c46a6a':v>.87?'#6aa0c4':'#d4b05a');
}
function drawStoneWall(g,X,Y,tx,ty){
  px(g,X,Y,16,16,'#4a4d58');
  for(let r=0;r<3;r++){ const off=(r%2)*5;
    for(let c=-1;c<3;c++){ const v=hash(tx*5+c+r,ty*3+r);
      px(g, X+c*6+off+1, Y+r*5+1, 5,4, v>.5?'#83879a':'#767a8c'); } }
  px(g,X,Y,16,1,'#9da1b4');
  if(!SOLID.has(tileAt(tx,ty+1)) || tileAt(tx,ty+1)!=='#') px(g,X,Y+14,16,2,'#33353e');
  if(hash(tx*2,ty*7)>.8){ px(g,X+10,Y+3,3,2,'#5e7a4e'); px(g,X+11,Y+2,1,1,'#74935e'); }
}
function drawFence(g,X,Y,tx,ty){
  drawGroundDirt(g,X,Y,tx,ty);
  px(g,X,Y+3,16,2,'#6e5436'); px(g,X,Y+9,16,2,'#6e5436');
  for(let i=0;i<3;i++){ const fx=X+1+i*6;
    px(g,fx,Y+1,3,13, hash(tx*3+i,ty)>.5?'#8a6b46':'#7e6140');
    px(g,fx,Y+1,3,1,'#a8854f'); px(g,fx,Y+13,3,1,'#54401f'); }
}
function drawRoof(g,X,Y,tx,ty){
  px(g,X,Y,16,16,'#3d4150');
  for(let r=0;r<4;r++){
    px(g,X,Y+r*4,16,1,'#2c2f3a');
    for(let c=0;c<4;c++) px(g,X+c*4+1,Y+r*4+1,3,1, hash(tx+c,ty*4+r)>.5?'#4d5264':'#454a5a');
  }
  if(tileAt(tx,ty-1)!=='A') px(g,X,Y,16,2,'#5d6275');           // 용마루
  if(tileAt(tx,ty+1)!=='A'){ px(g,X,Y+14,16,2,'#272a33');        // 처마
    for(let c=0;c<4;c++) px(g,X+c*4+1,Y+15,2,1,'#6d7288'); }
  if(tileAt(tx-1,ty)!=='A') px(g,X,Y,1,16,'#52566a');
  if(tileAt(tx+1,ty)!=='A') px(g,X+15,Y,1,16,'#52566a');
}
function drawHouseWall(g,X,Y,tx,ty,kind){
  px(g,X,Y,16,16,'#b3a07e');                                     // 회벽
  for(let i=0;i<5;i++){ const v=hash(tx*9+i,ty+i);
    px(g,X+((v*15)|0),Y+2+((hash(tx,ty*3+i)*12)|0),1,1,'#a6936f'); }
  px(g,X,Y,2,16,'#7a5c3e'); px(g,X+14,Y,2,16,'#7a5c3e');         // 기둥
  px(g,X,Y,16,2,'#6b4f33'); px(g,X,Y+14,16,2,'#5c452c');
  if(kind==='W'){ px(g,X+3,Y+4,10,8,'#3a2c1c');
    px(g,X+4,Y+5,8,6,'#ffd98a'); px(g,X+7,Y+5,1,6,'#b08040'); px(g,X+4,Y+7,8,1,'#b08040');
    px(g,X+4,Y+5,3,2,'#fff2c8'); }
  if(kind==='D'){ px(g,X+4,Y+3,8,13,'#4a3526'); px(g,X+5,Y+4,6,11,'#5c422e');
    px(g,X+8,Y+4,1,11,'#3c2b1d'); px(g,X+6,Y+9,1,2,'#caa050'); }
}
function drawPot(g,X,Y,tx,ty){
  drawGroundDirt(g,X,Y,tx,ty);
  px(g,X+3,Y+7,10,7,'#9c5230'); px(g,X+2,Y+6,12,2,'#b06038');
  px(g,X+4,Y+9,2,4,'#7e3f24'); px(g,X+3,Y+13,10,1,'#6b351e');
  const v=hash(tx,ty*5);
  px(g,X+7,Y+3,2,4,'#3f6b35');
  px(g,X+5,Y+2,3,2, v>.5?'#5e8f4a':'#6d9c55'); px(g,X+9,Y+1,3,3,'#54834a');
  if(v>.6){ px(g,X+6,Y+1,2,2,'#d97f9c'); px(g,X+10,Y+0,2,2,'#e8b0c0'); }
}
function drawLantern(g,X,Y,tx,ty,ground){
  ground(g,X,Y,tx,ty);
  px(g,X+7,Y+2,2,12,'#3a2c20'); px(g,X+7,Y+2,6,2,'#3a2c20');     // 기둥+팔
  px(g,X+11,Y+4,1,2,'#2c2118');
  px(g,X+9,Y+6,5,6,'#e8762a'); px(g,X+10,Y+7,3,4,'#ffb05a');     // 등불
  px(g,X+10,Y+8,3,1,'#ffd98a'); px(g,X+10,Y+5,3,1,'#a04818'); px(g,X+11,Y+12,1,1,'#a04818');
  px(g,X+6,Y+13,4,1,'#241b12');
}
function drawSign(g,X,Y,tx,ty){
  drawGroundDirt(g,X,Y,tx,ty);
  px(g,X+7,Y+8,2,7,'#5c452c');
  px(g,X+2,Y+2,12,7,'#8a6b46'); px(g,X+3,Y+3,10,5,'#a8854f');
  px(g,X+4,Y+4,2,3,'#4a3018'); px(g,X+7,Y+4,3,1,'#4a3018');      // 손글씨 느낌 획
  px(g,X+8,Y+6,1,1,'#4a3018'); px(g,X+11,Y+4,1,3,'#4a3018');
}
function drawTreeBase(g,X,Y,tx,ty){
  drawGroundDirt(g,X,Y,tx,ty);
  px(g,X+6,Y+6,4,9,'#5a4128'); px(g,X+5,Y+12,2,3,'#4e3823'); px(g,X+9,Y+11,2,2,'#4e3823');
}
function drawCanopy(g,X,Y,tx,ty){
  const cx=X+8, cy=Y+4;
  const blob=(bx,by,r,c)=>{ for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++)
    if(dx*dx+dy*dy<=r*r && hash(bx+dx,by+dy)>.12) px(g,bx+dx,by+dy,1,1,c); };
  blob(cx,cy,11,'#3d5a34'); blob(cx-5,cy-2,7,'#4a6b3e'); blob(cx+5,cy-3,6,'#4a6b3e');
  blob(cx-1,cy-5,5,'#5a7e4a');
  for(let i=0;i<14;i++){ const a=hash(i*3,tx)*6.28, r=hash(i,ty*7)*9;
    px(g, cx+Math.cos(a)*r|0, cy+Math.sin(a)*r*0.8|0,1,1,'#6d9558'); }
}

(function renderMap(){
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
    const X=tx*TILE, Y=ty*TILE, ch=MAP_ROWS[ty][tx];
    switch(ch){
      case '.': drawGroundDirt(mc,X,Y,tx,ty); break;
      case ',': drawGroundPaved(mc,X,Y,tx,ty); break;
      case '*': drawGroundPlaza(mc,X,Y,tx,ty); break;
      case '#': drawStoneWall(mc,X,Y,tx,ty); break;
      case '=': drawFence(mc,X,Y,tx,ty); break;
      case 'A': drawRoof(mc,X,Y,tx,ty); break;
      case 'H': drawHouseWall(mc,X,Y,tx,ty,'H'); break;
      case 'W': drawHouseWall(mc,X,Y,tx,ty,'W'); break;
      case 'D': drawHouseWall(mc,X,Y,tx,ty,'D'); break;
      case 'p': drawPot(mc,X,Y,tx,ty); break;
      case 'L': drawLantern(mc,X,Y,tx,ty, (ty<=6&&tx>=21)?drawGroundPlaza:(MAP_ROWS[ty][tx-1]===','?drawGroundPaved:drawGroundDirt)); break;
      case 's': drawSign(mc,X,Y,tx,ty); break;
      case 't': drawTreeBase(mc,X,Y,tx,ty); break;
    }
  }
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++)
    if(MAP_ROWS[ty][tx]==='t') drawCanopy(mc,tx*TILE,ty*TILE,tx,ty);
})();

/* =========================================================
   사운드 (WebAudio 합성)
   ========================================================= */
const SND = {
  ctx:null, master:null, muted:false,
  init(){
    if(this.ctx) { this.ctx.resume(); return; }
    const AC = window.AudioContext||window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);
    this.startAmbience();
  },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.value = m?0:0.9; },
  noiseBuf(){
    const len=this.ctx.sampleRate*3, b=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=b.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    return b;
  },
  startAmbience(){
    const c=this.ctx;
    /* 멀리서 들리는 사람들 웅성거림 */
    const src=c.createBufferSource(); src.buffer=this.noiseBuf(); src.loop=true;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=340;
    const g=c.createGain(); g.gain.value=0.045;
    const lfo=c.createOscillator(); lfo.frequency.value=0.11;
    const lfoG=c.createGain(); lfoG.gain.value=0.018;
    lfo.connect(lfoG); lfoG.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(); lfo.start();
    /* 어쿠스틱 기타 루프 */
    const N={E3:164.81,G3:196,A3:220,C4:261.63,D4:293.66,E4:329.63,G4:392,A4:440};
    const seq=[N.A3,0,N.E4,0, N.C4,0,N.E4,0, N.G3,0,N.D4,0, N.E4,0,N.C4,0,
               N.A3,0,N.E4,0, N.G4,0,N.E4,0, N.E3,0,N.D4,0, N.C4,0,N.D4,N.E4];
    const bass=[110,0,0,0,0,0,0,0, 98,0,0,0,0,0,0,0, 110,0,0,0,0,0,0,0, 82.4,0,0,0,0,0,0,0];
    const step=0.42; let i=0, t=c.currentTime+0.6;
    this._gt = setInterval(()=>{
      while(t < c.currentTime+0.45){
        const n=seq[i%seq.length], b=bass[i%bass.length];
        if(n && Math.random()>0.08) this.pluck(n, t, 0.05+Math.random()*0.035);
        if(b) this.pluck(b, t, 0.055);
        t+=step; i++;
      }
    },120);
  },
  pluck(freq, when, vol){
    const c=this.ctx;
    const o1=c.createOscillator(); o1.type='triangle'; o1.frequency.value=freq;
    const o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.001;
    const g=c.createGain(), g2=c.createGain(); g2.gain.value=0.25;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1900;
    g.gain.setValueAtTime(0,when);
    g.gain.linearRampToValueAtTime(vol,when+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,when+1.25);
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(lp); lp.connect(this.master);
    o1.start(when); o2.start(when); o1.stop(when+1.3); o2.stop(when+1.3);
  },
  mew(p=1){
    if(!this.ctx) return;
    const c=this.ctx, t0=c.currentTime;
    const o=c.createOscillator(); o.type='sawtooth';
    const curve=new Float32Array([480,640,860,920,840,600,430].map(v=>v*p));
    o.frequency.setValueAtTime(curve[0],t0);
    o.frequency.setValueCurveAtTime(curve,t0,0.38);
    const vib=c.createOscillator(); vib.frequency.value=7.3;
    const vibG=c.createGain(); vibG.gain.value=14*p;
    vib.connect(vibG); vibG.connect(o.frequency);
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1050*p; bp.Q.value=2.2;
    const g=c.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(0.16,t0+0.05);
    g.gain.setValueAtTime(0.16,t0+0.22);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.46);
    o.connect(bp); bp.connect(g); g.connect(this.master);
    o.start(t0); vib.start(t0); o.stop(t0+0.5); vib.stop(t0+0.5);
  },
  ping(){
    if(!this.ctx) return;
    const c=this.ctx,t0=c.currentTime;
    const o=c.createOscillator(); o.type='triangle'; o.frequency.value=1240;
    const g=c.createGain();
    g.gain.setValueAtTime(0.045,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+0.32);
  },
  foundJingle(){
    if(!this.ctx) return;
    const t0=this.ctx.currentTime;
    [659.25,880].forEach((f,i)=>this.pluck(f,t0+i*0.09,0.07));
  },
  endChime(){
    if(!this.ctx) return;
    const t0=this.ctx.currentTime+0.2;
    [440,523.25,659.25,880,1046.5].forEach((f,i)=>this.pluck(f,t0+i*0.16,0.09));
  }
};

const player={ x:19*16+8, y:27*16+8, dir:'down', moving:false, anim:0, speed:74 };
function passable(x,y){
  return !solidAt(Math.floor(x/16), Math.floor(y/16));
}
function tryMove(dx,dy,dt){
  const HW=4, HH=3;
  let nx=player.x+dx*player.speed*dt;
  if(passable(nx-HW,player.y-HH)&&passable(nx+HW,player.y-HH)&&
     passable(nx-HW,player.y+HH)&&passable(nx+HW,player.y+HH)) player.x=nx;
  let ny=player.y+dy*player.speed*dt;
  if(passable(player.x-HW,ny-HH)&&passable(player.x+HW,ny-HH)&&
     passable(player.x-HW,ny+HH)&&passable(player.x+HW,ny+HH)) player.y=ny;
}

/* =========================================================
   고양이 그리기
   ========================================================= */
function drawCatSit(g,x,y,cat,t,scale=1){
  /* x,y = 발 밑 중심 */
  g.save(); g.translate(x,y); if(scale!==1) g.scale(scale,scale);
  const C=cat.color, B=cat.belly;
  const tw=Math.sin(t*2.4+x)*2;                       // 꼬리
  px(g,-6+tw|0,-3,2,1,C); px(g,-7+tw|0,-6,2,3,C); px(g,-6+tw|0,-7,2,2,C);
  px(g,-4,-6,8,6,C);                                  // 몸통
  px(g,-2,-3,4,3,B);                                  // 가슴
  px(g,-3,-11,7,6,C);                                 // 머리
  px(g,-3,-13,2,2,C); px(g,2,-13,2,2,C);              // 귀
  px(g,-2,-12,1,1,'#d98a8a'); px(g,3,-12,1,1,'#d98a8a');
  const blink=(Math.sin(t*0.7+y)>0.97);
  if(!blink){ px(g,-2,-9,2,2,cat.eye); px(g,1,-9,2,2,cat.eye);
    px(g,-1,-9,1,1,'#101018'); px(g,2,-9,1,1,'#101018'); }
  else { px(g,-2,-8,2,1,'#101018'); px(g,1,-8,2,1,'#101018'); }
  px(g,0,-7,1,1,'#c87878');                            // 코
  px(g,-3,0,3,1,'#16161e'); px(g,1,0,3,1,'#16161e');   // 그림자발
  g.restore();
}
function drawPeek(g,cat,t){
  const X=cat.tx*16, Y=cat.ty*16, C=cat.color;
  const bob=Math.sin(t*2+cat.tx)>0.4?1:0;
  switch(cat.hide){
    case 'pot':    // 화분 안 — 귀+눈만
      px(g,X+5,Y+4-bob,2,2,C); px(g,X+9,Y+4-bob,2,2,C);
      px(g,X+5,Y+6-bob,6,2,C);
      px(g,X+6,Y+6-bob,1,1,cat.eye); px(g,X+9,Y+6-bob,1,1,cat.eye); break;
    case 'sign':   // 입간판 뒤 — 옆으로 빼꼼
      px(g,X+13,Y+4-bob,2,2,C); px(g,X+13,Y+7,3,4,C);
      px(g,X+14,Y+8,1,1,cat.eye); break;
    case 'lantern':// 등불 기둥 뒤 — 꼬리
      { const tw=Math.sin(t*3)*2|0;
        px(g,X+3,Y+10,2,4,C); px(g,X+2+tw,Y+7,2,3,C); px(g,X+4,Y+13,3,2,C); } break;
    case 'roof':   // 지붕 위 웅크림
      px(g,X+4,Y+8,9,4,C); px(g,X+11,Y+5,2,3,C); px(g,X+12,Y+4-bob,1,1,C);
      px(g,X+9,Y+4-bob,1,1,C);
      px(g,X+10,Y+7,1,1,cat.eye); break;
    case 'wall':   // 담장 위 — 엎드림 + 늘어진 꼬리
      { const tw=Math.sin(t*2.2)*3|0;
        px(g,X+3,Y+2,10,4,C); px(g,X+11,Y+0,3,3,C);
        px(g,X+12,Y-1-bob,1,1,C); px(g,X+11,Y-1-bob,1,1,C);
        px(g,X+12,Y+1,1,1,cat.eye);
        px(g,X+2,Y+5,2,5+tw,C); } break;
    case 'corner': // 구석에서 식빵
      px(g,X+4,Y+8,8,5,C); px(g,X+10,Y+5,3,3,C);
      px(g,X+10,Y+4-bob,1,1,C); px(g,X+12,Y+4-bob,1,1,C);
      px(g,X+11,Y+6,1,1,cat.eye); break;
    case 'tree':   // 나무 그늘 — 빛나는 눈
      if(Math.sin(t*0.9)>-0.6){ px(g,X+5,Y+5,2,2,cat.eye); px(g,X+9,Y+5,2,2,cat.eye); } break;
  }
}
function seatPos(cat){
  switch(cat.hide){
    case 'pot':     return [cat.x,    cat.y+18];
    case 'sign':    return [cat.x+16, cat.y+10];
    case 'lantern': return [cat.x-12, cat.y+14];
    case 'roof':    return [cat.x,    cat.y+4 ];
    case 'wall':    return [cat.x+2,  cat.y+6 ];
    case 'corner':  return [cat.x+6,  cat.y+10];
    case 'tree':    return [cat.x,    cat.y+14];
  }
}

const FIND_R=46;
function tryFind(){
  let best=null,bd=1e9;
  for(const c of CATS){ if(c.found) continue;
    const d=Math.hypot(c.x-player.x,c.y-player.y);
    if(d<FIND_R && d<bd){ bd=d; best=c; } }
  if(!best) return;
  best.found=true; best.foundT=0; found++;
  $('count').textContent=`고양이 ${found} / 7`;
  burst(best.x,best.y);
  SND.foundJingle(); SND.mew(best.pitch);
  showCard(best);
  if(found===7){ setTimeout(()=>{ SND.endChime(); showEnd(); }, 2600); }
}

function showCard(cat){
  const pc=$('cardPortrait'), g=pc.getContext('2d');
  g.imageSmoothingEnabled=false; g.clearRect(0,0,24,24);
  g.fillStyle='#1c1633'; g.fillRect(0,0,24,24);

  $('cardDesc').textContent = cat.desc;

  clearTimeout(cardTimer);
  cardTimer=setTimeout(()=>card.classList.remove('show'), 3400);
}

const darkCv=document.createElement('canvas'); darkCv.width=VIEW_W; darkCv.height=VIEW_H;
const dk=darkCv.getContext('2d');
const vinCv=document.createElement('canvas'); vinCv.width=VIEW_W; vinCv.height=VIEW_H;
(function(){ const g=vinCv.getContext('2d');
  const grd=g.createRadialGradient(160,120,90,160,120,210);
  grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,'rgba(0,0,10,0.42)');
  g.fillStyle=grd; g.fillRect(0,0,VIEW_W,VIEW_H); })();

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; gameT+=dt;

  /* --- 업데이트 --- */
  if(state==='play'){
    let dx=0,dy=0;
    if(keys['arrowleft']||keys['a'])dx-=1;
    if(keys['arrowright']||keys['d'])dx+=1;
    if(keys['arrowup']||keys['w'])dy-=1;
    if(keys['arrowdown']||keys['s'])dy+=1;
    if(dx&&dy){dx*=0.707;dy*=0.707;}
    player.moving=!!(dx||dy);
    if(player.moving){
      tryMove(dx,dy,dt); player.anim+=dt*9;
      player.dir = Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
    }
    for(const c of CATS){
      if(c.found){ c.foundT+=dt; continue; }
      const near=Math.hypot(c.x-player.x,c.y-player.y)<FIND_R;
      if(near&&!c.near) SND.ping();
      c.near=near;
    }
  }
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=60*dt; s.life-=dt;
    if(s.life<=0) sparks.splice(i,1); }
  for(const f of flies){ f.a+=(Math.random()-0.5)*dt*3;
    f.x+=Math.cos(f.a)*f.s*dt; f.y+=Math.sin(f.a)*f.s*dt*0.6-1.5*dt;
    if(f.x<8)f.x=MAP_W*16-8; if(f.x>MAP_W*16-8)f.x=8;
    if(f.y<8)f.y=MAP_H*16-8; if(f.y>MAP_H*16-8)f.y=8; }

  /* --- 카메라 --- */
  const camX=Math.max(0,Math.min(MAP_W*16-VIEW_W, player.x-VIEW_W/2))|0;
  const camY=Math.max(0,Math.min(MAP_H*16-VIEW_H, player.y-VIEW_H/2))|0;

  /* --- 맵 --- */
  ctx.drawImage(mapCv, -camX, -camY);
  ctx.save(); ctx.translate(-camX,-camY);

  /* 줄전구 */
  ctx.strokeStyle='rgba(30,24,40,0.9)'; ctx.lineWidth=1;
  for(let i=0;i<bulbs.length;i++){ const b=bulbs[i];
    const sway=Math.sin(gameT*1.3+i)*0.8;
    ctx.fillStyle=b.hue; ctx.fillRect(b.x+sway|0, b.y|0, 2,2);
  }

  /* 고양이 */
  for(const c of CATS){
    if(!c.found){ drawPeek(ctx,c,gameT);
      if(c.near){
        const p=(Math.sin(gameT*5)+1)/2;
        ctx.globalAlpha=0.35+p*0.4;
        ctx.strokeStyle='#ffe7a0';
        ctx.beginPath(); ctx.arc(c.x,c.y,9+p*3,0,6.28); ctx.stroke();
        ctx.globalAlpha=1;
        const sy=c.y-16-p*2;
        px(ctx,c.x-1,sy-3,1,7,'#fff2c8'); px(ctx,c.x-4,sy,7,1,'#fff2c8');
        px(ctx,c.x-2,sy-1,3,3,'#ffd98a');
      }
    } else {
      const k=Math.min(1,c.foundT/0.7), [sx,sy]=seatPos(c);
      const jx=c.x+(sx-c.x)*k, jy=c.y+(sy-c.y)*k - Math.sin(k*Math.PI)*14;
      drawCatSit(ctx,jx,jy,c,gameT, k<1?(1+Math.sin(k*Math.PI)*0.25):1);
      if(c.foundT>1 && Math.sin(gameT*1.5+c.tx)>0.92)
        px(ctx,sx+5,sy-16-(gameT*8%4|0),3,3,'#ff9ab0');
    }
  }

  /* 플레이어 */
  (function(){
    const x=Math.round(player.x), y=Math.round(player.y);
    const step=player.moving?(Math.floor(player.anim)%2):0;
    px(ctx,x-4,y+2,8,2,'rgba(0,0,0,0.35)');
    const flip=player.dir==='left';
    ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1);
    px(ctx,-3,-1,2,4,'#3a3548'); px(ctx,1,-1,2,4,'#3a3548');         // 다리
    if(player.moving){ px(ctx,-3,-1+step,2,4-step,'#3a3548'); px(ctx,1,2-step,2,1,'#26233a'); }
    px(ctx,-4,-8,8,8,'#8a4f3a');                                      // 코트
    px(ctx,-4,-8,8,2,'#a05f44');
    px(ctx,-4,-4,2,3,'#7a4534'); px(ctx,2,-4,2,3,'#7a4534');          // 팔
    px(ctx,-3,-9,6,2,'#e8b23a');                                      // 목도리
    px(ctx,2,-8,2,3,'#e8b23a');
    px(ctx,-3,-15,7,7,'#f0c8a0');                                     // 얼굴
    px(ctx,-3,-16,7,3,'#3a3046'); px(ctx,-3,-13,1,2,'#3a3046'); px(ctx,3,-13,1,2,'#3a3046');
    if(player.dir!=='up'){
      const ex=player.dir==='down'?0:1;
      px(ctx,-1+ex,-12,1,2,'#2a2438'); px(ctx,2+ex>3?3:2+ex,-12,1,2,'#2a2438');
      if(Math.sin(gameT*0.8)>0.96){ px(ctx,-1+ex,-11,1,1,'#f0c8a0'); }
    } else { px(ctx,-3,-15,7,5,'#3a3046'); }
    ctx.restore();
  })();

  /* 파티클 */
  for(const s of sparks){ ctx.globalAlpha=Math.max(0,s.life/0.7);
    px(ctx,s.x|0,s.y|0,2,2,s.c); }
  ctx.globalAlpha=1;
  ctx.restore();

  /* --- 어둠 + 빛 --- */
  dk.globalCompositeOperation='source-over';
  dk.fillStyle='rgba(13,15,42,0.82)'; dk.fillRect(0,0,VIEW_W,VIEW_H);
  dk.globalCompositeOperation='destination-out';
  const punch=(x,y,r,a)=>{
    if(x<-r||y<-r||x>VIEW_W+r||y>VIEW_H+r) return;
    const g=dk.createRadialGradient(x,y,1,x,y,r);
    g.addColorStop(0,'rgba(0,0,0,'+a+')'); g.addColorStop(0.55,'rgba(0,0,0,'+(a*0.55)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    dk.fillStyle=g; dk.beginPath(); dk.arc(x,y,r,0,6.28); dk.fill();
  };
  for(const L of lights){
    const fl=0.88+0.12*Math.sin(gameT*7+L.fl)+0.04*Math.sin(gameT*23+L.fl*3);
    punch(L.x-camX, L.y-camY, L.r*fl, 0.95);
  }
  punch(player.x-camX, player.y-camY-4, 50, 0.8);
  for(const f of flies) punch(f.x-camX,f.y-camY,7,0.7);
  ctx.drawImage(darkCv,0,0);

  /* 따뜻한 빛 번짐 */
  ctx.globalCompositeOperation='lighter';
  for(const L of lights){
    const x=L.x-camX, y=L.y-camY;
    if(x<-80||y<-80||x>VIEW_W+80||y>VIEW_H+80) continue;
    const fl=0.85+0.15*Math.sin(gameT*6.3+L.fl);
    const g=ctx.createRadialGradient(x,y,1,x,y,L.r*0.62*fl);
    const col=L.col||'rgba(255,150,50,';
    if(L.col){ ctx.globalAlpha=0.18;
      const gg=ctx.createRadialGradient(x,y,0,x,y,9);
      gg.addColorStop(0,L.col); gg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,9,0,6.28); ctx.fill();
      ctx.globalAlpha=1;
    } else {
      g.addColorStop(0,'rgba(255,160,60,'+(0.13*L.warm*fl)+')');
      g.addColorStop(1,'rgba(255,120,40,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,L.r*0.62,0,6.28); ctx.fill();
    }
  }
  /* 반딧불 */
  for(const f of flies){
    const x=f.x-camX, y=f.y-camY;
    if(x<0||y<0||x>VIEW_W||y>VIEW_H) continue;
    const tw=(Math.sin(gameT*3+f.ph)+1)/2;
    ctx.globalAlpha=0.25+tw*0.55;
    px(ctx,x|0,y|0,1,1,'#ffe9a0');
    ctx.globalAlpha=tw*0.2;
    px(ctx,x-1|0,y-1|0,3,3,'#ffd060');
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.drawImage(vinCv,0,0);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
